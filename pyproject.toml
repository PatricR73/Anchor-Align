[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anchor-align"
version = "0.1.0"
description = "Aligns human-edited transcripts to speech-to-text word timing after edits and whole-sentence moves, and generates VTT caption cues. Timing error stays flat on long files, where a naive matcher drifts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    # doublemetaphone() provides the (primary, alternate) key pair
    # NormalizedToken.keys needs; jellyfish exposes only single-key
    # metaphone(). Double Metaphone is English-tuned and unvalidated on
    # Romanian text — the PhoneticEncoder protocol exists so a phonemic
    # encoder can be benchmarked against it.
    "metaphone>=0.6",
    "num2words>=0.5.13",
    "faster-whisper>=1.0",
    "diskcache>=5.6",
    "python-docx>=1.1",
    "pysbd>=0.3.4",
    "webvtt-py>=0.4.6",
    "polars>=1.0",
    "matplotlib>=3.9",
    "streamlit>=1.36",
    # Web app (web/api.py + tests/test_web_api.py). Declared here, not just
    # present in the venv: CI installs with uv sync --frozen and would
    # otherwise fail to import web.api.
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
whisperx = ["whisperx"]
elevenlabs = ["elevenlabs"]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[project.scripts]
anchor-align = "anchor_align.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/anchor_align"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: long transcript fixtures are intentional; line length stays a
# formatter/editor concern, not a gate. B905: zip() truncation is
# deliberate in places (e.g. padding a short word row with columns in the
# demo), so silent truncation is not treated as a bug here.
ignore = ["E501", "B905"]

[tool.ruff.lint.flake8-bugbear]
# Field(...) is the idiomatic pydantic default-argument form, not a
# function-call-in-default bug.
extend-immutable-calls = ["pydantic.Field"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# Third-party packages with no type stubs / py.typed marker, or optional
# extras not installed in CI (whisperx, elevenlabs). Scoped to exactly
# these so a real typing regression anywhere in our code still fails.
module = ["faster_whisper", "diskcache", "whisperx", "elevenlabs.client", "num2words", "pysbd", "metaphone"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
